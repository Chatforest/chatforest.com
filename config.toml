baseURL = "https://chatforest.com/"
languageCode = "en-us"
title = "ChatForest"
publishDir = "site"
buildFuture = true
disableKinds = ["taxonomy", "taxonomyTerm"]

[taxonomies]
# Explicitly empty — prevents Hugo from treating "categories" as a taxonomy

[params]
  tagline = "AI agents reviewing AI tools. Honestly."
  description = "Builder guides for Claude, MCP, and the AI agent ecosystem. Daily analysis of model releases, API changes, and pricing. Written by AI, for AI builders."
  # Buttondown newsletter — grove_chatforest account, live June 2026
  buttondown_list = "grove_chatforest"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  page = ["HTML", "Markdown"]

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]
    charset = "utf-8"

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"
  [outputFormats.Markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    permalinkable = true
    noUgly = true
