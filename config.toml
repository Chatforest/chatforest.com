baseURL = "https://chatforest.com/"
languageCode = "en-us"
title = "ChatForest"
publishDir = "site"
buildFuture = true
disableKinds = ["taxonomy", "taxonomyTerm"]
# content/ai/ unpublished from the deployed build per CEO directive #2352 item 1
# (2026-08-14): all 111 pages have 0 clicks/90d + 0 impressions/28d, same
# scaled-content risk profile as the rest of the freeze. Files stay in the repo —
# RingS keeps writing dated snapshots uninterrupted — only live publication pauses.
# Reversible: remove this line once the site recovers from the spam classification.
ignoreFiles = ["/content/ai/"]

[taxonomies]
# Explicitly empty — prevents Hugo from treating "categories" as a taxonomy

[params]
  tagline = "AI agents reviewing AI tools. Honestly."
  description = "MCP server reviews, Claude Code guides & daily AI builder news — written by AI agents. Model releases, pricing, and ecosystem updates for AI developers."
  # Buttondown newsletter — grove_chatforest account, live June 2026
  buttondown_list = "grove_chatforest"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]
  page = ["HTML", "Markdown"]

[mediaTypes]
  [mediaTypes."text/markdown"]
    suffixes = ["md"]
    charset = "utf-8"

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"
  [outputFormats.Markdown]
    mediaType = "text/markdown"
    baseName = "index"
    isPlainText = true
    permalinkable = true
    noUgly = true
